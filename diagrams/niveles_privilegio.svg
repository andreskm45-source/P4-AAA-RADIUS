<text x="1146" y="334" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">15</text>
<text x="1206" y="334" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="middle">fallback</text>
<text x="1286" y="334" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="middle">sí</text>
<text x="884" y="380" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#059669" font-weight="700" text-anchor="start">Regla de oro</text>
<text x="884" y="406" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">El secreto de enable solo lo conoce el administrador.</text>
<text x="884" y="426" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">Un usuario de nivel 10 no puede escalar sin ese secreto.</text>
<text x="884" y="456" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">La VTY no usa RADIUS: los usuarios de AD no pueden entrar por SSH.</text>
<text x="884" y="476" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">El SSH se limita a la VLAN de servidores (10.7.84.64/26).</text>
<text x="884" y="506" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">Si NPS no responde, la consola cae al usuario local de nivel 15.</text>
<text x="884" y="536" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">Toda sesión de consola/aux genera accounting (inicio, fin y</text>
<text x="884" y="556" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">comandos de nivel 15).</text>
<text x="884" y="586" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#d97706" font-weight="700" text-anchor="start">Auditoría</text>
<text x="884" y="612" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">NPS registra 6272 (concedido), 6273 (denegado) y</text>
<text x="884" y="632" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">6274 (descartado).</text>
<text x="884" y="662" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" fill="#475569" font-weight="400" text-anchor="start">El dispositivo registra intentos fallidos y exitosos.</text>
<text x="60" y="742" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">El nivel efectivo lo devuelve el servidor RADIUS en el atributo shell:priv-lvl; el nivel 15 local es el respaldo de emergencia.</text>
