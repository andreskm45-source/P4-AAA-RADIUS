! ============================================================================
!  R1-P4  |  Router Cisco IOS  |  Laboratorio P4 - Seguridad de Redes
!  Autor  : Rafael Andres Reyes De La Cruz  -  Matricula 2025-0784
!  Red    : 10.7.84.0/24   |  AAA con RADIUS (Windows NPS 10.7.84.66)
!  Uso    : pegar en configuracion global. Ver docs/04_Configuracion_Router.md
!  NOTA   : ejecutar "crypto key generate rsa modulus 2048" tras cargar el bloque
! ============================================================================

hostname R1-P4

! --- 1. Endurecimiento base y contexto de seguridad -------------------------
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service sequence-numbers
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no ip domain lookup
ip domain name p4.redes.local
no ip http server
no ip http secure-server
no ip source-route
no ip finger
clock timezone COT -5 0

banner login ^C
+--------------------------------------------------------------+
|  ACCESO RESTRINGIDO - LABORATORIO P4 - 10.7.84.0/24          |
|  Autenticacion RADIUS/NPS. Toda actividad es registrada.     |
|  Desconectese si no esta autorizado.                         |
+--------------------------------------------------------------+
^C

! --- 2. Credenciales ---------------------------------------------------------
! Secreto de enable: solo lo conoce el administrador (no se entrega a niveles 0/5/10)
enable secret CAMBIAR_CLAVE

! Usuario LOCAL de privilegio 15: SSH y respaldo si NPS no responde
username admin.p4 privilege 15 secret CAMBIAR_CLAVE

! --- 3. SSH (unico acceso remoto permitido) ---------------------------------
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh logging events

! --- 4. AAA / RADIUS ---------------------------------------------------------
aaa new-model
aaa session-id common
aaa authorization console

! Servidor RADIUS: Windows NPS (AD DS + NPS)
radius server NPS-P4
 address ipv4 10.7.84.66 auth-port 1812 acct-port 1813
 key CAMBIAR_CLAVE
 timeout 5
 retransmit 2

! Grupo de servidores RADIUS
aaa group server radius RAD-P4
 server name NPS-P4

! Metodo usado SOLO por consola y auxiliar
aaa authentication login CON-RADIUS group RAD-P4 local
aaa authorization exec CON-RADIUS group RAD-P4 local
aaa accounting exec CON-RADIUS start-stop group RAD-P4
aaa accounting commands 15 CON-RADIUS start-stop group RAD-P4

! Origen del trafico RADIUS (VLAN 99) y de las consultas NTP
ip radius source-interface GigabitEthernet0/0.99
ntp server 10.7.84.66
ntp source GigabitEthernet0/0.99

! Logs de autenticacion (exitos y fallos) y de AAA
login on-failure log
login on-success log
logging buffered 16384 informational
logging console warnings
logging monitor informational

! --- 5. Niveles de privilegio 0 / 5 / 10 / 15 -------------------------------
! Nivel 0  : sin comandos (solo enable, disable, help, exit, logout)
! Nivel 5  : comandos show de usuario + ping/traceroute (por defecto IOS)
! Nivel 10 : vision de configuracion y consola de configuracion
privilege exec level 10 show running-config
privilege exec level 10 show startup-config
privilege exec level 10 configure
privilege exec level 10 write

! --- 6. Interfaces y enrutamiento -------------------------------------------
interface GigabitEthernet0/0
 description TRUNK-HACIA-SW1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description VLAN10-USUARIOS-10.7.84.0/26
 encapsulation dot1Q 10
 ip address 10.7.84.1 255.255.255.192
 ip access-group ACL-USUARIOS-IN in
 no shutdown
!
interface GigabitEthernet0/0.20
 description VLAN20-SERVIDORES-10.7.84.64/26
 encapsulation dot1Q 20
 ip address 10.7.84.65 255.255.255.192
 no shutdown
!
interface GigabitEthernet0/0.99
 description VLAN99-GESTION-AAA-10.7.84.128/26
 encapsulation dot1Q 99
 ip address 10.7.84.129 255.255.255.192
 no shutdown
!
interface GigabitEthernet0/0.999
 description VLAN999-NATIVA-SIN-USO
 encapsulation dot1Q 999 native
 no ip address
 shutdown
!
interface GigabitEthernet0/1
 description WAN-NO-USADA-EN-LAB
 no ip address
 shutdown

! --- 7. DHCP para la VLAN de usuarios (opcional, para PC de prueba) ---------
ip dhcp excluded-address 10.7.84.1 10.7.84.19
ip dhcp pool VLAN10-USUARIOS
 network 10.7.84.0 255.255.255.192
 default-router 10.7.84.1
 dns-server 10.7.84.66
 domain-name p4.redes.local
 lease 0 8

! --- 8. Politicas de acceso ------------------------------------------------
! La VLAN de gestion solo es accesible desde la VLAN de servidores (admin)
ip access-list standard SSH-ADMIN
 permit 10.7.84.64 0.0.0.63

! Los usuarios no alcanzan la VLAN de gestion
ip access-list extended ACL-USUARIOS-IN
 deny ip 10.7.84.0 0.0.0.63 10.7.84.128 0.0.0.63
 permit ip any any

! --- 9. Lineas: AAA SOLO en consola y auxiliar ------------------------------
line con 0
 login authentication CON-RADIUS
 authorization exec CON-RADIUS
 accounting exec CON-RADIUS
 accounting commands 15 CON-RADIUS
 exec-timeout 5 0
 logging synchronous
stopbits 1
line aux 0
 login authentication CON-RADIUS
 authorization exec CON-RADIUS
 accounting exec CON-RADIUS
 accounting commands 15 CON-RADIUS
 exec-timeout 5 0
 logging synchronous

! VTY: autenticacion LOCAL (los usuarios RADIUS no entran por SSH) + solo SSH
line vty 0 4
 login local
 transport input ssh
 access-class SSH-ADMIN in
 exec-timeout 10 0
 logging synchronous
line vty 5 15
 login local
 transport input none

end
