! ============================================================================
!  SW1-P4  |  Variante para Cisco IOU/IOL L2 (interfaces Ethernet0/x)
!  Autor   : Rafael Andres Reyes De La Cruz  -  Matricula 2025-0784
!  Uso     : usar SOLO si el switch del laboratorio es IOU L2. Si es Catalyst
!            2960, usar configs/SW1-P4_base.cfg.
!  Diferencias: nombres de interfaz y ausencia de puerto auxiliar.
! ============================================================================

hostname SW1-P4

service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service sequence-numbers
no service pad
no ip domain lookup
ip domain name p4.redes.local
no ip http server
no ip http secure-server
clock timezone COT -5 0

enable secret CAMBIAR_CLAVE
username admin.p4 privilege 15 secret CAMBIAR_CLAVE

ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh logging events

aaa new-model
aaa session-id common
aaa authorization console

radius server NPS-P4
 address ipv4 10.7.84.66 auth-port 1812 acct-port 1813
 key CAMBIAR_CLAVE
 timeout 5
 retransmit 2

aaa group server radius RAD-P4
 server name NPS-P4

aaa authentication login CON-RADIUS group RAD-P4 local
aaa authorization exec CON-RADIUS group RAD-P4 local
aaa accounting exec CON-RADIUS start-stop group RAD-P4
aaa accounting commands 15 CON-RADIUS start-stop group RAD-P4

ip radius source-interface Vlan99
ntp server 10.7.84.66
ntp source Vlan99

login on-failure log
login on-success log
logging buffered 16384 informational
logging console warnings
logging monitor informational

privilege exec level 10 show running-config
privilege exec level 10 show startup-config
privilege exec level 10 configure
privilege exec level 10 write

vlan 10
 name USUARIOS
vlan 20
 name SERVIDORES
vlan 99
 name GESTION-AAA
vlan 999
 name NATIVA-PARKING

interface Ethernet0/0
 description TRUNK-HACIA-R1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 switchport nonegotiate
 no shutdown
!
interface Ethernet0/1
 description SRV1-P4-AD-NPS-VLAN20
 switchport access vlan 20
 switchport mode access
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet0/2
 description DEMO-CLIENTE-VLAN10
 switchport access vlan 10
 switchport mode access
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet0/3
 description PUERTO-NO-USADO
 switchport access vlan 999
 switchport mode access
 shutdown
!
interface Vlan99
 description GESTION-AAA
 ip address 10.7.84.130 255.255.255.192
 no shutdown
!
ip default-gateway 10.7.84.129

spanning-tree mode rapid-pvst

ip access-list standard SSH-ADMIN
 permit 10.7.84.64 0.0.0.63

! IOU/IOL no tiene puerto auxiliar: el requisito se cumple sobre console y VTY.
line con 0
 login authentication CON-RADIUS
 authorization exec CON-RADIUS
 accounting exec CON-RADIUS
 accounting commands 15 CON-RADIUS
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
 access-class SSH-ADMIN in
 exec-timeout 10 0
 logging synchronous
line vty 5 15
 login local
 transport input none

end
