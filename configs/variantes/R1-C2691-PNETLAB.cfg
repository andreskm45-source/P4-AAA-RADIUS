! P4 - Router C2691 de la topologia mostrada (solo laboratorio)
! Fa0/0 <-> switch Ethernet0/0. Fa0/1 <-> Net: no se modifica.
! Claves locales, enable y RADIUS: CAMBIAR_CLAVE. NPS debe usar la misma clave.
! Pegar desde configure terminal; adaptar comandos que IOS rechace.
hostname R1-P4
no ip domain lookup
ip domain name p4.redes.local
service password-encryption
service timestamps log datetime msec
enable secret CAMBIAR_CLAVE
username admin.p4 privilege 15 secret CAMBIAR_CLAVE
!
aaa new-model
radius-server host 10.7.84.66 auth-port 1812 acct-port 1813 key CAMBIAR_CLAVE
radius-server timeout 5
radius-server retransmit 2
aaa group server radius RAD-P4
 server 10.7.84.66 auth-port 1812 acct-port 1813
 exit
aaa authentication login CON-RADIUS group RAD-P4 local
aaa authentication login VTY-LOCAL local
aaa authorization exec CON-RADIUS group RAD-P4 local
aaa authorization console
aaa accounting exec CON-RADIUS start-stop group RAD-P4
aaa accounting commands 15 CON-RADIUS start-stop group RAD-P4
ip radius source-interface FastEthernet0/0.99
!
interface FastEthernet0/0
 description TRUNK-HACIA-SW2-E0/0
 no ip address
 no shutdown
interface FastEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.7.84.1 255.255.255.192
interface FastEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.7.84.65 255.255.255.192
interface FastEthernet0/0.99
 encapsulation dot1Q 99
 ip address 10.7.84.129 255.255.255.192
!
ip dhcp excluded-address 10.7.84.1 10.7.84.19
ip dhcp pool VLAN10-USUARIOS
 network 10.7.84.0 255.255.255.192
 default-router 10.7.84.1
 dns-server 10.7.84.66
 exit
ip access-list standard SSH-ADMIN
 permit 10.7.84.64 0.0.0.63
 exit
logging buffered 16384 informational
login on-failure log
login on-success log
privilege exec level 10 show running-config
privilege exec level 10 show startup-config
privilege exec level 10 configure
privilege exec level 10 write
!
line con 0
 login authentication CON-RADIUS
 authorization exec CON-RADIUS
 accounting exec CON-RADIUS
 logging synchronous
line aux 0
 login authentication CON-RADIUS
 authorization exec CON-RADIUS
 accounting exec CON-RADIUS
 logging synchronous
line vty 0 4
 login authentication VTY-LOCAL
 transport input ssh
 access-class SSH-ADMIN in
 logging synchronous
end
! Generar RSA desde configuracion global: crypto key generate rsa modulus 2048
! Usar 1024 bits si el IOS no admite 2048; despues:
! configure terminal
! ip ssh version 2
! end
! write memory
