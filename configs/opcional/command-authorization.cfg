! ============================================================================
!  OPCIONAL - Autorizacion por comando (TACACS+/RADIUS por comando)
!  Laboratorio P4 - Rafael Andres Reyes De La Cruz - 2025-0784
!
!  ADVERTENCIA: no aplicar antes de leer docs/04_Configuracion_Router.md.
!  Si el servidor RADIUS rechaza las peticiones Service-Type=Authorize-Only,
!  el administrador local queda sin poder ejecutar comandos de nivel 15.
!
!  Requisitos para usarlo con NPS:
!    1. Crear una politica NPS adicional "P4-AUTHORIZE-ONLY" con condicion
!       Service-Type = Authorize Only y permiso Grant Access.
!    2. Verificar con "debug aaa authorization" antes de dejarlo en produccion.
!    3. Mantener una sesion de consola abierta y usar "reload in 5" al probar.
! ============================================================================

aaa authorization commands 15 CMD-RADIUS group RAD-P4 local

line con 0
 authorization commands 15 CMD-RADIUS
line aux 0
 authorization commands 15 CMD-RADIUS

! Verificacion:
!   test aaa authorization command 15 <usuario> <comando> ?   (segun plataforma)
!   show aaa method-lists
!   debug aaa authorization
