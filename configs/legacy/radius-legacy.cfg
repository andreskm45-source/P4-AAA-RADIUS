! ============================================================================
!  P4 - AAA con RADIUS / AD DS / NPS
!  Variante LEGACY del cliente RADIUS (IOS 12.2 / 15.0 en Catalyst 2960)
! ----------------------------------------------------------------------------
!  Cuando usar este archivo
!  ------------------------
!  El bloque 4 de R1-P4_base.cfg y SW1-P4_base.cfg usa la sintaxis moderna
!  de "objeto servidor RADIUS":
!
!      radius server NPS-P4
!       address ipv4 10.7.84.66 auth-port 1812 acct-port 1813
!       key ...
!
!  Esa sintaxis NO existe en IOS 12.2(55)SE y en algunas imagenes 15.0(2)SE
!  de Catalyst 2960. En esos equipos el comando se rechaza con:
!
!      % Invalid input detected at '^' marker.
!
!  En ese caso se reemplaza UNICAMENTE el bloque 4 (definicion del servidor y
!  del grupo) por el contenido de este archivo. Las listas de metodos
!  (aaa authentication / authorization / accounting), el source-interface,
!  el NTP y los logs NO cambian: ya estan en el archivo base.
! ----------------------------------------------------------------------------
!  Orden de aplicacion
!  -------------------
!  1) Pegar primero el bloque "limpieza" (borra la definicion moderna si quedo
!     a medias).
!  2) Pegar despues el bloque "configuracion legacy".
!  3) Verificar con:  show running-config | include radius
!                     test aaa group RAD-P4 usr.nivel10 <clave> legacy
! ============================================================================

! --- 1. Limpieza de la definicion moderna (si quedo parcial) -----------------
no radius server NPS-P4
no aaa group server radius RAD-P4

! --- 2. Configuracion legacy ------------------------------------------------
! Clave compartida global: debe coincidir con el "Shared Secret" del
! Network Policy Server en Windows (10.7.84.66).
radius-server key CAMBIAR_CLAVE
radius-server timeout 5
radius-server retransmit 2

! Host RADIUS explicito (NPS de Windows: 1812/1813 estandar).
radius-server host 10.7.84.66 auth-port 1812 acct-port 1813 key CAMBIAR_CLAVE

! Grupo de servidores con el mismo nombre que usan las listas de metodos.
aaa group server radius RAD-P4
 server 10.7.84.66 auth-port 1812 acct-port 1813
 exit

! Origen del trafico RADIUS: debe ser una IP de la VLAN 99 para que NPS
! identifique al cliente como "P4-R1" / "P4-SW1".
!   Router R1  -> ip radius source-interface GigabitEthernet0/0.99
!   Switch SW1 -> ip radius source-interface Vlan99
! Descomentar solo la linea del equipo que se esta configurando:
! ip radius source-interface GigabitEthernet0/0.99
! ip radius source-interface Vlan99

! --- 3. Verificacion --------------------------------------------------------
! show running-config | include radius
! show aaa servers
! test aaa group RAD-P4 usr.nivel10 CAMBIAR_CLAVE legacy
! debug radius          (apagar despues con: undebug all)
! ============================================================================
