! ============================================================================
!  SW1-P4  |  Switch Cisco Catalyst 2960 / IOU L2  |  Laboratorio P4
!  Autor   : Rafael Andres Reyes De La Cruz  -  Matricula 2025-0784
!  Red     : 10.7.84.0/24  |  AAA con RADIUS (Windows NPS 10.7.84.66)
!  Uso     : pegar en configuracion global. Ver docs/05_Configuracion_Switch.md
!  NOTA    : si la plataforma no tiene puerto auxiliar, omitir "line aux 0".
!            Adaptar los nombres de interfaz a la imagen usada en PNetLab.
! ============================================================================

hostname SW1-P4

! --- 1. Endurecimiento base --------------------------------------------------
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service sequence-numbers
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no ip domain lookup
ip domain name p4.redes.local
no ip http server
no ip http secure-server
no ip source-route
no ip finger
clock timezone COT -5 0

banner login ^C
+--------------------------------------------------------------+
|  ACCESO RESTRINGIDO - LABORATORIO P4 - SW1-P4                |
|  Autenticacion RADIUS/NPS. Toda actividad es registrada.     |
+--------------------------------------------------------------+
^C

! --- 2. Credenciales ---------------------------------------------------------
enable secret CAMBIAR_CLAVE
username admin.p4 privilege 15 secret CAMBIAR_CLAVE

! --- 3. SSH ------------------------------------------------------------------
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh logging events

! --- 4. AAA / RADIUS ---------------------------------------------------------
aaa new-model
aaa session-id common
aaa authorization console

radius server NPS-P4
 address ipv4 10.7.84.66 auth-port 1812 acct-port 1813
 key CAMBIAR_CLAVE
 timeout 5
 retransmit 2

aaa group server radius RAD-P4
 server name NPS-P4

aaa authentication login CON-RADIUS group RAD-P4 local
aaa authorization exec CON-RADIUS group RAD-P4 local
aaa accounting exec CON-RADIUS start-stop group RAD-P4
aaa accounting commands 15 CON-RADIUS start-stop group RAD-P4

ip radius source-interface Vlan99
ntp server 10.7.84.66
ntp source Vlan99

login on-failure log
login on-success log
logging buffered 16384 informational
logging console warnings
logging monitor informational

! --- 5. Niveles de privilegio 0 / 5 / 10 / 15 -------------------------------
privilege exec level 10 show running-config
privilege exec level 10 show startup-config
privilege exec level 10 configure
privilege exec level 10 write

! --- 6. VLANs ----------------------------------------------------------------
vlan 10
 name USUARIOS
vlan 20
 name SERVIDORES
vlan 99
 name GESTION-AAA
vlan 999
 name NATIVA-PARKING

! --- 7. Capa 2: trunk, acceso al servidor y puertos de usuario ---------------
interface GigabitEthernet0/1
 description TRUNK-HACIA-R1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 no shutdown
!
interface GigabitEthernet0/2
 description SRV1-P4-AD-NPS-VLAN20
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 5.00
 no cdp enable
 no shutdown
!
! Puerto disponible para un PC/VPC de prueba (VLAN 10)
interface GigabitEthernet0/3
 description DEMO-CLIENTE-VLAN10
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 5.00
 no cdp enable
 no shutdown
!
! Puertos no utilizados: apagados y en VLAN de parking
interface range GigabitEthernet0/4-24
 description PUERTO-NO-USADO
 switchport mode access
 switchport access vlan 999
 shutdown

! --- 8. Gestion y gateway ----------------------------------------------------
interface Vlan99
 description GESTION-AAA
 ip address 10.7.84.130 255.255.255.192
 no shutdown
!
ip default-gateway 10.7.84.129

! --- 9. Seguridad de Capa 2 --------------------------------------------------
ip dhcp snooping
ip dhcp snooping vlan 10
no ip dhcp snooping information option
interface GigabitEthernet0/1
 ip dhcp snooping trust
!
spanning-tree mode rapid-pvst

! --- 10. Politicas de acceso -------------------------------------------------
ip access-list standard SSH-ADMIN
 permit 10.7.84.64 0.0.0.63

! --- 11. Lineas: AAA SOLO en consola y auxiliar ------------------------------
line con 0
 login authentication CON-RADIUS
 authorization exec CON-RADIUS
 accounting exec CON-RADIUS
 accounting commands 15 CON-RADIUS
 exec-timeout 5 0
 logging synchronous
! Omitir este bloque si la plataforma no expone line aux 0
line aux 0
 login authentication CON-RADIUS
 authorization exec CON-RADIUS
 accounting exec CON-RADIUS
 accounting commands 15 CON-RADIUS
 exec-timeout 5 0
 logging synchronous

line vty 0 4
 login local
 transport input ssh
 access-class SSH-ADMIN in
 exec-timeout 10 0
 logging synchronous
line vty 5 15
 login local
 transport input none

end
